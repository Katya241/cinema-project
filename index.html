<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Cinema - сайт кинотеатра</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/Style.css" />
  </head>
  <body>
    <header class="header">
      <div class="navbar container">
        <a href="/">
          <img src="img/logo.svg" alt="logo" />
        </a>
        <nav class="nav">
          <button class="m-menu">
            <svg
              width="15"
              height="11"
              viewBox="0 0 15 11"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <line y1="0.5" x2="15" y2="0.5" stroke="white" />
              <line y1="5.5" x2="15" y2="5.5" stroke="white" />
              <line y1="10.5" x2="15" y2="10.5" stroke="white" />
            </svg>
          </button>
          <ul class="menu">
            <li class="menu-item">
              <a href="#" class="menu-link">Главная</a>
            </li>
            <li class="menu-item">
              <a href="#" class="menu-link">Фильмы</a>
            </li>
            <li class="menu-item">
              <a href="#" class="menu-link">Кинотеатры</a>
            </li>
            <li class="menu-item">
              <a href="#" class="menu-link">События</a>
            </li>
            <li class="menu-item">
              <a href="#" class="menu-link">Поддержка</a>
            </li>
          </ul>
        </nav>
        <div class="user">
          <span>Привет, Мила</span>
          <img class="avatar" src="img/avatar.svg" alt="Мила" />
        </div>
      </div>
    </header>

    <script src="js/scripts.js"></script>
  </body>
</html>
